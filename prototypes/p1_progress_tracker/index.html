<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Tracker Prototype</title>
<style>
  :root {
    --surface: #F6F4EF; --card: #FFFDF9; --ink: #12313A; --muted: #4A5A60;
    --line: #DCE3E0; --series: #B5481F; --band: #BFD8D5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 16px/1.45 "Segoe UI", Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 16px; }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav button { flex: 1; padding: 8px; font: inherit; color: var(--ink); cursor: pointer;
               background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  nav button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  h1 { font-size: 22px; margin: 0; }
  .sub { margin: 2px 0 16px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font: 11px "Segoe UI", Arial, sans-serif; fill: var(--muted); }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 18px; height: 10px; border-radius: 2px; background: var(--band); }
  .swatch.series { height: 3px; background: var(--series); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stats p { margin: 0; color: var(--muted); font-size: 14px; }
  .stats b { display: block; color: var(--ink); font-size: 22px; }
  .note { font-size: 13px; color: var(--muted); text-align: center; }
  #tip { position: fixed; display: none; pointer-events: none; padding: 4px 8px; font-size: 13px;
         color: var(--card); background: var(--ink); border-radius: 6px; }
</style>
</head>
<body>
<main>
  <nav aria-label="Choose a screen">
    <button data-screen="1">Screen 1</button>
    <button data-screen="2">Screen 2</button>
    <button data-screen="3">Screen 3</button>
  </nav>
  <h1>Your shoulder recovery</h1>
  <p class="sub">Week 14 after surgery</p>
  <section class="card">
    <h2>How high you can raise your arm</h2>
    <svg id="chart" viewBox="0 0 360 250" role="img"></svg>
    <div class="legend">
      <span><i class="swatch series"></i>You</span>
      <span><i class="swatch"></i>Expected range</span>
    </div>
  </section>
  <section class="card stats">
    <p><b id="today"></b>You today</p>
    <p><b>110–135°</b>Expected this week</p>
    <p><b>Good</b>How you feel today</p>
    <p><b>150°</b>Goal: reach the high shelf</p>
  </section>
  <p class="note">Prototype with fictional data. Expected range is illustrative, not clinical guidance.</p>
</main>
<div id="tip"></div>
<script>
  // Illustrative values for testing whether the chart can be read. Not clinical data.
  const weeks = [2, 4, 6, 8, 10, 12, 14];
  const low = [30, 40, 55, 70, 85, 100, 110];
  const high = [55, 70, 85, 100, 115, 125, 135];
  const screens = {
    1: [45, 55, 68, 80, 92, 96, 98],         // Behind the range, though feeling well.
    2: [42, 60, 74, 88, 102, 114, 125],      // Within the range.
    3: [50, 68, 86, 104, 118, 132, 146],     // Above the range.
  };

  const box = { left: 36, right: 348, top: 12, bottom: 216 };
  const x = (week) => box.left + (week - 2) / 12 * (box.right - box.left);
  const y = (degrees) => box.bottom - degrees / 180 * (box.bottom - box.top);
  const svg = document.getElementById('chart');
  const tip = document.getElementById('tip');
  const series = 'var(--series)';

  function add(tag, attributes, parent = svg) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
    parent.appendChild(node);
    return node;
  }

  function label(text, attributes) {
    add('text', attributes).textContent = text;
  }

  function draw(screen) {
    svg.replaceChildren();
    const values = screens[screen];
    const today = values[values.length - 1];
    svg.setAttribute('aria-label', `Arm raise over weeks 2 to 14, ending at ${today} degrees.`);

    [0, 45, 90, 135, 180].forEach((tick) => {
      add('line', { x1: box.left, x2: box.right, y1: y(tick), y2: y(tick), stroke: '#E7ECEA' });
      label(`${tick}°`, { x: box.left - 6, y: y(tick) + 4, 'text-anchor': 'end' });
    });
    weeks.forEach((week) => label(week, { x: x(week), y: box.bottom + 16, 'text-anchor': 'middle' }));
    label('Weeks after surgery', { x: (box.left + box.right) / 2, y: box.bottom + 32, 'text-anchor': 'middle' });

    const upper = weeks.map((week, i) => `${x(week)},${y(high[i])}`);
    const lower = weeks.map((week, i) => `${x(week)},${y(low[i])}`).reverse();
    add('polygon', { points: [...upper, ...lower].join(' '), fill: 'var(--band)', opacity: 0.75,
                         stroke: '#5F8F8A', 'stroke-width': 1 });

    add('line', { x1: box.left, x2: box.right, y1: y(150), y2: y(150), stroke: 'var(--muted)',
                  'stroke-dasharray': '4 4' });
    label('Goal: high shelf', { x: box.left + 4, y: y(150) - 5 });

    add('polyline', { points: weeks.map((week, i) => `${x(week)},${y(values[i])}`).join(' '),
                      fill: 'none', stroke: series, 'stroke-width': 2 });
    weeks.forEach((week, i) => {
      add('circle', { cx: x(week), cy: y(values[i]), r: 4, fill: series,
                      stroke: 'var(--card)', 'stroke-width': 2 });
      const target = add('circle', { cx: x(week), cy: y(values[i]), r: 16, fill: 'transparent' });
      const text = `Week ${week}: you ${values[i]}°, expected ${low[i]}–${high[i]}°`;
      target.addEventListener('pointerenter', (event) => {
        tip.textContent = text;
        tip.style.display = 'block';
        tip.style.left = `${Math.min(event.clientX + 8, innerWidth - 240)}px`;
        tip.style.top = `${event.clientY - 36}px`;
      });
      target.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
    });

    document.getElementById('today').textContent = `${today}°`;
    document.querySelectorAll('nav button').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.screen === String(screen)));
    });
  }

  document.querySelectorAll('nav button').forEach((button) => {
    button.addEventListener('click', () => draw(button.dataset.screen));
  });
  draw(1);
</script>
</body>
</html>
